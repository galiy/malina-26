{{define "shutdown"}}
<!doctype html>
<html lang="{{.Lang}}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{index .T "shutdown.page_title"}}</title>
  <link rel="stylesheet" href="{{asset "app.css"}}">
  <link rel="icon" type="image/gif" href="{{asset "img/malina_small.gif"}}">
</head>
<body class="app-body">
  <main class="content">
    <section class="card reboot-card">
      <div class="reboot-logo"><img src="{{asset "img/malina_small.gif"}}" alt="Malina"></div>
      <h1 class="reboot-title">{{index .T "shutdown.waiting"}}</h1>
      <p class="muted">{{index .T "shutdown.hint"}}</p>
    </section>
  </main>
</body>
</html>
{{end}}
