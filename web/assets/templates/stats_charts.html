{{define "content"}}
<table class="page-head-tbl"><tr>
  <td class="ph-title"><h1>{{index .T "menu.charts"}}</h1></td>
  <td class="ph-hint">{{index .T "stats.charts_hint"}}</td>
  <td class="ph-follow">
    <label class="check"><input type="checkbox" id="stats-show-stale"> {{index .T "stats.show_stale"}}</label>
  </td>
</tr></table>

<div id="stats-tabs" class="stats-tabs"></div>

<div class="stats-controls">
  <button class="btn" data-period="24h">{{index .T "stats.p24h"}}</button>
  <button class="btn" data-period="today">{{index .T "stats.p_today"}}</button>
  <button class="btn" data-period="yesterday">{{index .T "stats.p_yesterday"}}</button>
  <button class="btn" data-period="7d">{{index .T "stats.p_7d"}}</button>
  <button class="btn" data-period="month">{{index .T "stats.p_month"}}</button>
  <button class="btn" data-period="last">{{index .T "stats.p_last"}}</button>
  <span class="stats-custom">
    <input type="datetime-local" id="ch-from" step="1">
    <input type="datetime-local" id="ch-to" step="1">
    <button class="btn" id="ch-show">{{index .T "stats.show"}}</button>
  </span>
  <button class="btn" id="ch-reload">{{index .T "stats.refresh"}}</button>
  <label class="check" id="ch-compare-wrap" hidden><input type="checkbox" id="ch-compare"> {{index .T "stats.compare"}}</label>
  <span class="charts-follow-group" id="ch-follow-group">
    <label class="check charts-follow"><input type="checkbox" id="ch-follow"> {{index .T "stats.follow"}}</label>
    <span class="charts-depth" id="ch-depth-wrap" hidden>
      <input type="range" id="ch-depth" min="1" max="10" step="1" value="5">
      <span id="ch-depth-val">5</span> {{index .T "stats.minutes"}}
    </span>
  </span>
</div>

<div id="stats-charts" class="stats-charts"></div>

<script>window.I18N = {{json .T}};</script>
<script src="{{asset "vendor/chartjs/chart.umd.min.js"}}"></script>
<script src="{{asset "vendor/chartjs/chartjs-adapter-date-fns.bundle.min.js"}}"></script>
<script src="{{asset "vendor/chartjs/hammer.min.js"}}"></script>
<script src="{{asset "vendor/chartjs/chartjs-plugin-zoom.min.js"}}"></script>
<script src="{{asset "js/stats_charts.js"}}"></script>
{{end}}
