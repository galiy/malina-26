{{define "content"}}
<div class="map-head">
  <h1 class="map-title">{{.Title}}</h1>
  <label class="map-pause"><input type="checkbox" id="mapPause"> {{index .T "map.disable_update"}}</label>
</div>

<div class="flash err" id="mapErr" hidden></div>

<div class="map-tabs">
  <button type="button" class="map-tab active" data-tab="monitor">Монитор</button>
  <button type="button" class="map-tab" data-tab="info">Информация</button>
  <button type="button" class="map-tab" data-tab="control">Управление</button>
</div>

<div class="map-tabpane" id="tab-monitor">
  <h2 class="map-sec">1. Новая панель</h2>
  <section class="mappanel" id="mpPanel"></section>

  <h2 class="map-sec">2. Рефакторинг панели</h2>
  <div class="map-isolated">
    <iframe class="legacy-frame" id="panel2frame" src="/static/legacy/panel2.html" title="Рефакторинг панели" loading="lazy"></iframe>
  </div>

  <h2 class="map-sec">3. Legacy панель</h2>
  <div class="map-isolated">
    <iframe class="legacy-frame" src="/static/legacy/panel.html?id={{.ID}}" title="Legacy МАП" loading="lazy"></iframe>
  </div>
</div>

<div class="map-tabpane" id="tab-info" hidden></div>
<div class="map-tabpane" id="tab-control" hidden></div>

<pre class="map-json" id="mapJson"></pre>

<script>
window.I18N = {{json .T}};
window.MAP_ID = {{.ID}};
window.MAP_SERIAL = {{json .SerialLabel}};
window.MAP_FIELDS = {{json .FieldNames}};
</script>
<script src="{{asset "map.js"}}"></script>
{{end}}
