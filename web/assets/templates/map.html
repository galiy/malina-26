{{define "content"}}
<div class="map-head">
  <h1 class="map-title">{{.Title}}</h1>
  <div class="map-headctl">
    <label class="map-pause"><input type="checkbox" id="mapPause"> {{index .T "map.disable_update"}}</label>
  </div>
</div>

<div class="flash err" id="mapErr" hidden></div>

<div class="map-tabs">
  <button type="button" class="map-tab active" data-tab="monitor">{{index .T "map.tab_monitor"}}</button>
  <button type="button" class="map-tab" data-tab="info">{{index .T "map.tab_info"}}</button>
  <button type="button" class="map-tab" data-tab="control">{{index .T "map.tab_control"}}</button>
</div>

<div class="map-tabpane" id="tab-monitor">
  <section class="mappanel" id="mpPanel"></section>
</div>

<div class="map-tabpane" id="tab-info" hidden>
  <div class="mi-subtabs">
    <button type="button" class="mi-subtab active" data-subtab="main">{{index .T "mi.sub_main"}}</button>
    <button type="button" class="mi-subtab" data-subtab="system">{{index .T "mi.sub_system"}}</button>
  </div>
  <div class="mi-pane" id="mi-main"></div>
  <div class="mi-pane" id="mi-system" hidden></div>
</div>
<div class="map-tabpane" id="tab-control" hidden></div>

<script>
window.I18N = {{json .T}};
window.MAP_ID = {{.ID}};
window.MAP_GEN = {{.Gen}};
window.MAP_SERIAL = {{json .SerialLabel}};
window.MAP_FIELDS = {{json .FieldNames}};
</script>
<script src="{{asset "control-data.js"}}"></script>
<script src="{{asset "control.js"}}"></script>
<script src="{{asset "mapinfo.js"}}"></script>
<script src="{{asset "map.js"}}"></script>
{{end}}
