{{define "content"}}
<div class="map-head">
  <h1 class="map-title">{{.Title}}</h1>
  <div class="map-headctl">
    <label class="map-pause"><input type="checkbox" id="kesPause"> {{index .T "map.disable_update"}}</label>
  </div>
</div>

<div class="flash err" id="kesErr" hidden></div>

<div class="map-tabs">
  <button type="button" class="map-tab active" data-tab="monitor">{{index .T "map.tab_monitor"}}</button>
</div>

<div class="map-tabpane" id="tab-monitor">
  <div class="kes-panel" id="kesPanel"></div>
</div>

<link rel="stylesheet" href="{{asset "legacy/css/glyphicons.css"}}">
<script>
window.I18N = {{json .T}};
window.KES_ID = {{.ID}};
window.KES_GEN = {{.Gen}};
window.KES_SERIAL = "{{.Serial}}";
</script>
<script src="{{asset "kes.js"}}"></script>
{{end}}
