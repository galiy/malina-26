{{define "content"}}
{{if .Err}}<div class="flash err">{{.Err}}</div>{{end}}
{{if .Ok}}<div class="flash ok">{{.Ok}}</div>{{end}}
<form method="post" action="/kes/settings">
  <div class="page-head page-head-left">
    <h1>{{index .T "kes.settings_title"}}</h1>
    <div class="head-actions">
      <button type="button" class="cancelbtn">{{index .T "sys.cancel"}}</button>
      <button type="submit">{{index .T "sys.save"}}</button>
    </div>
  </div>
  <table class="nettable"><tbody>
    <tr class="group"><td colspan="2">{{index .T "menu.kes"}}</td></tr>
    <tr>
      <td>{{index .T "bms.proxy_enabled"}}</td>
      <td><label><input type="checkbox" name="kes_enabled" {{if .Enabled}}checked{{end}}>&nbsp;{{index .T "reader.enabled_hint"}}</label></td>
    </tr>
    <tr>
      <td>{{index .T "bms.proxy_log_level"}}</td>
      <td>
        <select name="kes_log_level">
          {{range .Levels}}
          <option value="{{.}}" {{if eq . $.Level}}selected{{end}}>{{index $.T (printf "bms.proxy_level.%s" .)}}</option>
          {{end}}
        </select>
      </td>
    </tr>
  </tbody></table>
</form>
<script>
  document.querySelector(".cancelbtn").addEventListener("click", function () { this.form.reset(); });
</script>
{{end}}
