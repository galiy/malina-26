<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Рефакторинг панели</title>
<link rel="stylesheet" href="/static/legacy/css/bootstrap.min.css">
<link rel="stylesheet" href="/static/legacy/css/glyphicons.css">
<link rel="stylesheet" href="/static/legacy/css/glyphicons-bootstrap.css">
<link rel="stylesheet" href="/static/legacy/css/mystyles.css">
<link rel="stylesheet" href="/static/legacy/css/jquery.jqplot.css">
<style>
  html, body { background: #fff; }
  body { max-width: 1100px; margin: 0 auto; padding: 8px; }
  /* Фирменный стиль (тёмно-зелёный #0d5637 + жёлтый #fec678) — умеренно:
     рамка и шапка панели, тонкая жёлтая полоса снизу шапки. */
  .panel.panel-primary { border-color: #0d5637; }
  .panel-primary > .panel-heading { background-color: #0d5637; border-color: #0d5637; color: #fff; border-bottom: 2px solid #fec678; }

  /* Зелёные фоны вместо голубых (только панель 2). Градиенты сохраняем. */
  .table > tbody > tr > td.info { background-color: #eef3ee !important; }        /* был #d9edf7 (cos φ) */
  .phases_bar { background-color: #cfe3cf !important; }                           /* был #8cd2e7 (U buf/U chg) */
  .gradient_fill_blue { background: linear-gradient(to right, #a9c9a9, #e6f0e6, #a9c9a9) !important; }
</style>
</head>
<body>
<div class="panel panel-primary">
  <div class="panel panel-heading">
    <div class="row">
      <div class="col-md-3 col-lg-3 col-sm-3">
        <span class="glyphicons glyphicons-electrical-socket-eu drop" style="color:lightskyblue; font-size:200%;" title="Вход 1" id="map_input1"></span>
        <span style="font-size:200%;" class="glyphicons glyphicons-electrical-socket-eu drop light" title="Вход 2" id="map_input2"></span>
        <span style="font-size:200%;" class="glyphicons glyphicons-car-wheel drop rotate90 cooler_transition" style="color:lightgray" title="Вентилятор" id="map_cooler"></span>
        <div class="pull-right relay" title="Реле 2" id="map_relay2"><span style="font-size:200%;" class="glyphicon glyphicon-off"></span></div>
        <div class="pull-right relay" title="Реле 1" id="map_relay1"><span style="font-size:200%;" class="glyphicon glyphicon-off"></span></div>
      </div>
      <div class="col-md-5 col-lg-5 col-sm-5" style="background-color:ivory; color:black; font-weight:bolder; text-align:center; font-size:150%;" id="map_mode">MAC MODE</div>
      <div class="col-md-2 col-lg-2 col-sm-2" style="font-size:150%;text-align:center" id="map_time"></div>
      <div class="col-md-2 col-lg-2 col-sm-2 pull-right" style="text-align:right">
        &nbsp<span style="font-size:150%"><a data-toggle="collapse" href="#meters" style="color:#f9f9f9 !important;text-decoration: inherit !important;">МАП<span style="font-size:60%;"> ID:<span id="map_id_label">0</span></span></a></span>
      </div>
    </div>
  </div>
  <div class="panel-body">
    <table class="table">
      <tbody>
        <tr>
          <td width="50%" class="info">
            <span class="glyphicons glyphicons-electrical-socket-eu drop x0.5"></span>
            &nbsp
            <div id="f1" style="display:inline-block; font-weight:bolder; font-size:90%;">50.0Гц</div>
            <div style="display: inline-block; font-size: 90%; margin-left: 30%;" title="cos φ"><b>cos&thinsp;&phi;&thinsp;=</b> <span id="lambda">-.--</span></div>
            <div style="display:inline-block; font-weight:bolder" class="pull-right"><div id="f2" style="display:inline-block;font-size:90%;">50.0Гц</div>&nbsp<span class="glyphicons glyphicons-home x0.5 drop"></span></div>
            <div class="progress gradient_fill_3"><div class="slider" id="map_slider">0</div></div>
          </td>
          <td width="33.33%" style="background-color:lightgray;font-size:93%;"><span class="glyphicons glyphicons-battery-full drop"></span>
            <div class="phase" id="ab_slider_ph1">&#966;<sub>1</sub>:0&nbsp;кВт</div>
            <div class="phase" id="ab_slider_ph2">&#966;<sub>2</sub>:0&nbsp;кВт</div>
            <div class="phase" id="ab_slider_ph3">&#966;<sub>3</sub>:0&nbsp;кВт</div>
            <div class="phase" id="ab_slider_ph_summ">&#931;&#966;:0&nbsp;кВт</div>
            <div class="progress gradient_fill_1"><div class="slider" id="ab_slider">0</div></div>
          </td>
          <td width="16.7%" style="background-color:lightgreen;"><span class="glyphicons glyphicons-sun drop x0.5"></span>
            <div class="progress gradient_fill_2" id="mppt_progress_wrap"><div class="progress gradient_fill_2"><div class="slider" id="mppt_slider">0</div></div></div>
          </td>
        </tr>
        <tr>
          <td width="50%" class="info" style="text-align:left;">
            <span style="font-size:180%; color:#428bca;" class="glyphicons glyphicons-temperature drop"></span><div id="map_temp_1" style="display:inline-block;font-weight:bolder; font-size:150%;">20&degC</div>&nbsp
            <span style="font-size:180%; color:#428bca;" class="glyphicons glyphicons-electrical-plug drop"></span><div title="Энергия от сети" id="map_enet" style="display:inline-block;font-weight:bolder; font-size:150%;">&nbsp;0&nbsp;кВтч</div>&nbsp
            <span style="font-size:180%; color:#428bca;" class="glyphicons glyphicons-battery-charging drop"></span><div title="Энергия для заряда АКБ" id="map_echg" style="display:inline-block;font-weight:bolder; font-size:150%;">&nbsp;0&nbsp;кВтч</div>
            <div id="chartdiv_map" style="height:40px;width:80px; float:right;"></div>
          </td>
          <td width="33.33%" style="background-color:lightgray;">
            <span style="font-size:180%; color:#428bca;" class="glyphicons glyphicons-temperature drop"></span><div id="map_ab_temp" style="display:inline-block;font-weight:bolder; font-size:150%;">20&degC</div>&nbsp
            <span style="font-size:180%; color:#428bca;" class="glyphicons glyphicons-battery-50 drop"></span><div title="Энергия от АКБ" id="map_eacc" style="display:inline-block;font-weight:bolder; font-size:150%;">&nbsp;0&nbsp;кВтч</div>
            <div title="Баланс" id="chartdiv_ab" style="height:40px;width:80px; float:right;"></div>
          </td>
          <td width="16.7%" style="background-color:lightgreen;">
            <span style="font-size:180%; color:#5cb85c;" class="glyphicons glyphicons-leaf drop"></span><div id="map_ealt" style="display:inline-block;font-weight:bolder; font-size:150%;">&nbsp;н/д</div>&nbsp
          </td>
        </tr>
      </tbody>
    </table>
    <div class="container-fluid collapse in" style="position:relative" id="meters">
      <div class="col-md-2 col-lg-2 col-sm-2"><div class="js-gauge map_vin gauge" id="map_vin"></div></div>
      <div class="col-md-2 col-lg-2 col-sm-2"><div class="js-gauge map_vout gauge" id="map_vout"></div></div>
      <div class="col-md-2 col-lg-2 col-sm-2"><div class="js-gauge map_inet gauge" id="map_inet"></div></div>
      <div class="col-md-2 col-lg-2 col-sm-2"><div class="js-gauge map_uab gauge" id="map_uab"></div></div>
      <div class="col-md-2 col-lg-2 col-sm-2"><div class="js-gauge map_ibat gauge" id="map_ibat"></div></div>
      <div class="col-md-2 col-lg-2 col-sm-2"><div class="js-gauge map_ialt gauge" id="map_ialt"></div></div>
      <div class="col-md12 col-lg-12 col-sm12 phases_bar">
        <div class="gradient_fill_blue" style="display:inline-block">U buf(t&deg):<div id="Ubuf_t" style="display:inline-block">0</div>В&nbsp;&nbsp;</div>
        <div class="gradient_fill_blue" style="display:inline-block">U chg(t&deg):<div id="Uchg_t" style="display:inline-block">0</div>В&nbsp;&nbsp;</div>
        <div id="last_error" class="alert-warning" style="display:inline-block;">МАП ошибка</div>
        <div class="pull-right gradient_fill_blue">Ошибки&nbsp<span class="badge" id="errors_count">0</span><a data-toggle="collapse" href="#map_errors_list"><span class="glyphicons glyphicons-expand" style="font-size:140%"></span></a></div>
        <div id="map_errors_list" class="collapse errors">No errors</div>
      </div>
    </div>
  </div>
</div>

<script>
  window.MAP_ID = new URLSearchParams(location.search).get('id') || '0';
</script>
<script src="/static/legacy/js/jquery.js"></script>
<script src="/static/legacy/js/bootstrap.min.js"></script>
<script src="/static/legacy/js/raphael-min.js"></script>
<script src="/static/legacy/js/kuma-gauge.jquery.js"></script>
<script src="/static/legacy/js/jquery.jqplot.min.js"></script>
<script src="/static/legacy/js/plugins/jqplot.barRenderer.js"></script>
<script src="/static/legacy/js/plugins/jqplot.highlighter.js"></script>
<script src="/static/legacy/panel2.js"></script>
</body>
</html>
