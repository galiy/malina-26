# Malina: in-memory кэш телеметрии (Redis 7). Конфиг проекта; подключается
# systemd-дроп-ином /etc/systemd/system/redis-server.service.d/malina.conf.
# Назначение и модель данных — docs/redis-cache.md.

# Доступ только с самого устройства (loopback). Чтобы открыть доступ по сети —
# заменить bind на 0.0.0.0 и обязательно задать requirepass/ACL + ограничить
# nftables (см. docs/redis-cache.md, раздел «Доступ по сети»).
bind 127.0.0.1 -::1
protected-mode yes
port 6379

# Персиста нет: RDB/AOF выключены, рабочий каталог — tmpfs (/run). На диск
# (ro-корень) Redis писать не должен.
save ""
appendonly no
dir /run/redis
pidfile /run/redis/redis-server.pid

# Ограничение памяти и политика вытеснения (кэш: вытесняется любая запись).
maxmemory 200mb
maxmemory-policy allkeys-lru

daemonize no
supervised systemd
logfile ""
loglevel notice
