# Malina: запуск Redis с нашим конфигом (/etc/malina/redis.conf) вместо
# дистрибутивного /etc/redis/redis.conf. Пакетный конфиг не трогаем.
# Персист выключен, лимит памяти — см. /etc/malina/redis.conf и docs/redis-cache.md.
[Service]
ExecStart=
ExecStart=/usr/bin/redis-server /etc/malina/redis.conf --supervised systemd --daemonize no
