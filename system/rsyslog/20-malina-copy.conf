# Рабочий период проекта: дублируем ВСЕ логи в /malina/var/log без ротации.
# Облегчает отладку. Файл растёт — удалить по ЗАВЕРШЕНИИ проекта
# (см. deploy/restore.md, раздел «Временное»).
template(name="malinaMirror" type="string"
	string="%TIMESTAMP% %HOSTNAME% %syslogtag%%msg%\n")
*.* action(type="omfile" file="/malina/var/log/malina.log" template="malinaMirror")
